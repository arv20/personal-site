<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarav K — Engineer. Builder. Creator.</title>
  <meta name="description" content="Personal portfolio of Aarav K — software engineer, builder, and creator." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #e8e6e0;
      cursor: default;
    }

    ::selection {
      background: rgba(74, 255, 145, 0.2);
      color: #e8e6e0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ═══════════════════════════════════════════════
       THREE.JS CANVAS
       ═══════════════════════════════════════════════ */
    #scene-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════
       FILM GRAIN OVERLAY
       ═══════════════════════════════════════════════ */
    .film-grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 300%;
      height: 300%;
      z-index: 50;
      pointer-events: none;
      opacity: 0.06;
      mix-blend-mode: multiply;
      background-image: url("https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Dissolve_Noise_Texture.png");
      animation: animateGrain 8s steps(10) infinite;
    }

    @keyframes animateGrain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, -20%); }
      30% { transform: translate(-5%, -10%); }
      40% { transform: translate(-15%, -20%); }
      50% { transform: translate(-5%, -10%); }
      60% { transform: translate(-15%, -20%); }
      70% { transform: translate(-5%, -10%); }
      80% { transform: translate(-15%, -20%); }
      90% { transform: translate(-5%, -10%); }
    }

    /* ═══════════════════════════════════════════════
       VHS GLITCH OVERLAY
       ═══════════════════════════════════════════════ */
    .vhs-glitch {
      position: fixed;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 51;
      opacity: 0;
      animation: vhsGlitch 18s infinite;
    }

    .vhs-glitch::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 0, 0, 0.08) 2%,
        transparent 4%,
        rgba(0, 255, 0, 0.08) 6%,
        transparent 8%,
        rgba(0, 0, 255, 0.08) 10%,
        transparent 12%
      );
      animation: rgbShift 0.3s infinite;
    }

    .vhs-glitch::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.6);
      animation: scanlines 0.1s infinite;
    }

    @keyframes vhsGlitch {
      0%, 94% { opacity: 0; }
      95%, 97% { opacity: 1; transform: translateX(2px) skew(0.5deg); }
      98%, 100% { opacity: 0; }
    }

    @keyframes rgbShift {
      0% { transform: translateX(0) scaleX(1); }
      25% { transform: translateX(-1px) scaleX(1.01); }
      50% { transform: translateX(1px) scaleX(0.99); }
      75% { transform: translateX(-0.5px) scaleX(1.005); }
      100% { transform: translateX(0) scaleX(1); }
    }

    @keyframes scanlines {
      0% { top: 0; }
      100% { top: 100%; }
    }

    /* ═══════════════════════════════════════════════
       VHS STATIC
       ═══════════════════════════════════════════════ */
    .vhs-static {
      position: fixed;
      top: 20%;
      left: 20%;
      width: 60%;
      height: 60%;
      pointer-events: none;
      z-index: 51;
      opacity: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.02) 2px,
          rgba(0, 0, 0, 0.02) 4px
        );
      animation: staticGlitch 14s infinite;
    }

    @keyframes staticGlitch {
      0%, 88% { opacity: 0; }
      89%, 93% { opacity: 0.04; }
      94%, 100% { opacity: 0; }
    }

    /* ═══════════════════════════════════════════════
       CRT VIGNETTE
       ═══════════════════════════════════════════════ */
    .crt-vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 52;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.35) 100%
      );
    }

    /* ═══════════════════════════════════════════════
       HUD OVERLAY
       ═══════════════════════════════════════════════ */
    .hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 2.5rem clamp(1.5rem, 4vw, 3rem);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
      user-select: none;
    }

    .hud > * {
      pointer-events: auto;
    }

    /* ── Identity (bottom-left) ── */
    .hud-identity {
      opacity: 0;
      transform: translateY(24px);
    }

    .hud-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #e8e6e0;
      margin-bottom: 0.3rem;
    }

    .hud-title {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    /* ── Links (bottom-right) ── */
    .hud-links {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2.5vw, 2rem);
      opacity: 0;
      transform: translateY(24px) translateX(16px);
    }

    .hud-link {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.78rem, 1.3vw, 0.9rem);
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      position: relative;
      padding-bottom: 3px;
      transition: color 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .hud-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: #4AFF91;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-link:hover {
      color: #e8e6e0;
    }

    .hud-link:hover::after {
      width: 100%;
    }

    /* ── Link divider ── */
    .hud-link-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* ── Top-right status indicator ── */
    .hud-status {
      position: fixed;
      top: 2rem;
      right: clamp(1.5rem, 4vw, 3rem);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(-12px);
    }

    .hud-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4AFF91;
      animation: statusPulse 2.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 0.4; box-shadow: 0 0 0 0 rgba(74, 255, 145, 0.4); }
      50% { opacity: 1; box-shadow: 0 0 8px 2px rgba(74, 255, 145, 0.2); }
    }

    .hud-status-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Top-left logo mark ── */
    .hud-logo {
      position: fixed;
      top: 2rem;
      left: clamp(1.5rem, 4vw, 3rem);
      z-index: 100;
      opacity: 0;
      transform: translateY(-12px);
    }

    .hud-logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e8e6e0;
      letter-spacing: -0.04em;
    }

    .hud-logo-accent {
      color: #4AFF91;
    }

    /* ═══════════════════════════════════════════════
       LOADING SCREEN
       ═══════════════════════════════════════════════ */
    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-bar-container {
      width: 120px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      overflow: hidden;
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      background: #4AFF91;
      border-radius: 1px;
      transition: width 0.3s ease-out;
    }

    /* ═══════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════ */
    @media (max-width: 480px) {
      .hud {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.5rem;
        padding-bottom: 2rem;
      }

      .hud-links {
        gap: 1rem;
      }

      .hud-link-divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       LOADING SCREEN
       ═══════════════════════════════════════════════ -->
  <div class="loader" id="loader">
    <div class="loader-bar-container">
      <div class="loader-bar" id="loader-bar"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       THREE.JS CANVAS
       ═══════════════════════════════════════════════ -->
  <canvas id="scene-canvas"></canvas>

  <!-- ═══════════════════════════════════════════════
       VISUAL EFFECTS OVERLAYS
       ═══════════════════════════════════════════════ -->
  <div class="film-grain"></div>
  <div class="vhs-glitch"></div>
  <div class="vhs-static"></div>
  <div class="crt-vignette"></div>

  <!-- ═══════════════════════════════════════════════
       HUD: TOP-LEFT LOGO
       ═══════════════════════════════════════════════ -->
  <div class="hud-logo" id="hud-logo">
    <span class="hud-logo-text">a<span class="hud-logo-accent">k</span></span>
  </div>

  <!-- ═══════════════════════════════════════════════
       HUD: TOP-RIGHT STATUS

  <div class="hud-status" id="hud-status">

  <!-- ═══════════════════════════════════════════════
       HUD: BOTTOM BAR
       ═══════════════════════════════════════════════ -->
  <div class="hud" id="hud">
    <div class="hud-identity" id="hud-identity">
      <div class="hud-name">aarav k</div>

    <div class="hud-links" id="hud-links">
      <a href="https://github.com/arv20" class="hud-link" target="_blank" rel="noopener">github</a>
      <div class="hud-link-divider"></div>

      <a href="mailto:aarav@example.com" class="hud-link">email</a>
      <div class="hud-link-divider"></div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       THREE.JS
       ═══════════════════════════════════════════════ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ════════════════════════════════════════════════
    // CONFIGURATION
    // ════════════════════════════════════════════════
    const CONFIG = {
      PARTICLE_COUNT: 1800,
      SPHERE_RADIUS: 2.2,
      ACCENT_COLOR: 0x4AFF91,
      ACCENT_DIM: 0x1a6b3d,
      CAMERA_Z: 5.5,
      MOUSE_INFLUENCE: 0.3,
      ROTATION_SPEED: 0.00012,
      BREATHE_SPEED: 0.0008,
      BREATHE_AMOUNT: 0.08,
      MORPH_SPEED: 0.0003,
    };

    // ════════════════════════════════════════════════
    // LOADER
    // ════════════════════════════════════════════════
    const loaderEl = document.getElementById('loader');
    const loaderBar = document.getElementById('loader-bar');
    let loadProgress = 0;

    function updateLoader(progress) {
      loadProgress = Math.max(loadProgress, progress);
      loaderBar.style.width = loadProgress + '%';
    }

    function hideLoader() {
      updateLoader(100);
      setTimeout(() => {
        loaderEl.classList.add('hidden');
        startEntranceAnimation();
      }, 400);
    }

    // ════════════════════════════════════════════════
    // ENTRANCE ANIMATIONS
    // ════════════════════════════════════════════════
    function animateElement(el, delay, props = {}) {
      setTimeout(() => {
        el.style.transition = `opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1)`;
        el.style.opacity = '1';
        el.style.transform = 'translateY(0) translateX(0) scale(1)';
      }, delay);
    }

    function startEntranceAnimation() {
      const identity = document.getElementById('hud-identity');
      const links = document.getElementById('hud-links');
      const logo = document.getElementById('hud-logo');
      const status = document.getElementById('hud-status');

      animateElement(logo, 200);
      animateElement(status, 350);
      animateElement(identity, 550);
      animateElement(links, 750);
    }

    // ════════════════════════════════════════════════
    // MOUSE TRACKING
    // ════════════════════════════════════════════════
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    document.addEventListener('mousemove', (e) => {
      mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // ════════════════════════════════════════════════
    // THREE.JS SCENE
    // ════════════════════════════════════════════════
    (function initScene() {
      const canvas = document.getElementById('scene-canvas');
      if (!canvas) return;

      updateLoader(10);

      // Renderer
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 1);

      updateLoader(20);

      // Scene & Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = CONFIG.CAMERA_Z;

      updateLoader(30);

      // ── Generate particle positions ──
      const count = CONFIG.PARTICLE_COUNT;
      const positions = new Float32Array(count * 3);
      const spherePositions = new Float32Array(count * 3);
      const torusPositions = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);

      // Sphere positions (Fibonacci distribution)
      for (let i = 0; i < count; i++) {
        const phi = Math.acos(-1 + (2 * i) / count);
        const theta = Math.sqrt(count * Math.PI) * phi;
        const r = CONFIG.SPHERE_RADIUS;

        spherePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        spherePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        spherePositions[i * 3 + 2] = r * Math.cos(phi);
      }

      // Torus knot positions
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 4;
        const p = 2, q = 3;
        const r = 1.6;
        const tube = 0.7;

        const rr = r + tube * Math.cos(q * t);
        torusPositions[i * 3] = rr * Math.cos(p * t);
        torusPositions[i * 3 + 1] = rr * Math.sin(p * t);
        torusPositions[i * 3 + 2] = tube * Math.sin(q * t);
      }

      // Initialize at sphere
      for (let i = 0; i < count * 3; i++) {
        positions[i] = spherePositions[i];
      }

      // Random sizes and phases
      for (let i = 0; i < count; i++) {
        sizes[i] = Math.random() * 1.2 + 0.4;
        phases[i] = Math.random() * Math.PI * 2;
      }

      updateLoader(50);

      // ── Geometry ──
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      // ── Shader Material ──
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(CONFIG.ACCENT_COLOR) },
          uColorDim: { value: new THREE.Color(CONFIG.ACCENT_DIM) },
          uOpacity: { value: 0.0 },
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        },
        vertexShader: `
          attribute float size;
          uniform float uPixelRatio;
          uniform float uTime;
          varying float vDistance;

          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vDistance = length(position) / 3.0;
            gl_PointSize = size * uPixelRatio * (80.0 / -mvPosition.z);
            gl_PointSize = max(gl_PointSize, 0.8);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform vec3 uColorDim;
          uniform float uOpacity;
          uniform float uTime;
          varying float vDistance;

          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;

            // Sharp center core with soft falloff
            float alpha = 1.0 - smoothstep(0.05, 0.5, dist);
            alpha *= alpha; // quadratic falloff for sharper points
            vec3 color = mix(uColor, uColorDim, vDistance);

            // Subtle twinkle
            float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + vDistance * 20.0);

            gl_FragColor = vec4(color, alpha * uOpacity * twinkle);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      updateLoader(65);

      const points = new THREE.Points(geometry, material);
      // Offset the sphere to the right side of the viewport
      points.position.x = 1.5;
      points.position.y = 0.2;
      scene.add(points);

      // ── Ambient dust particles ──
      const dustCount = 400;
      const dustPositions = new Float32Array(dustCount * 3);
      const dustSizes = new Float32Array(dustCount);

      for (let i = 0; i < dustCount; i++) {
        dustPositions[i * 3] = (Math.random() - 0.5) * 16;
        dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 10;
        dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
        dustSizes[i] = Math.random() * 1.5 + 0.3;
      }

      const dustGeometry = new THREE.BufferGeometry();
      dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      dustGeometry.setAttribute('size', new THREE.BufferAttribute(dustSizes, 1));

      const dustMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(0xffffff) },
          uOpacity: { value: 0.0 },
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        },
        vertexShader: `
          attribute float size;
          uniform float uPixelRatio;
          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * uPixelRatio * (100.0 / -mvPosition.z);
            gl_PointSize = max(gl_PointSize, 0.5);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          uniform float uTime;
          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
            gl_FragColor = vec4(uColor, alpha * uOpacity * 0.15);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const dust = new THREE.Points(dustGeometry, dustMaterial);
      scene.add(dust);

      updateLoader(80);

      // ── Animation state ──
      let morphProgress = 0;
      let morphDirection = 1;
      let sceneReady = false;

      updateLoader(90);

      // Signal scene is ready
      setTimeout(() => {
        sceneReady = true;
        hideLoader();
      }, 600);

      // ── Animation loop ──
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsed = clock.getElapsedTime();
        const dt = clock.getDelta();

        // Smooth mouse
        mouse.x += (mouse.targetX - mouse.x) * 0.04;
        mouse.y += (mouse.targetY - mouse.y) * 0.04;

        // Fade in the scene
        if (sceneReady && material.uniforms.uOpacity.value < 0.65) {
          material.uniforms.uOpacity.value += 0.005;
          dustMaterial.uniforms.uOpacity.value += 0.005;
        }

        material.uniforms.uTime.value = elapsed;
        dustMaterial.uniforms.uTime.value = elapsed;

        // ── Morph between sphere and torus ──
        morphProgress += CONFIG.MORPH_SPEED * morphDirection;
        if (morphProgress >= 1) { morphProgress = 1; morphDirection = -1; }
        if (morphProgress <= 0) { morphProgress = 0; morphDirection = 1; }

        // Smooth morph easing
        const morphEased = morphProgress * morphProgress * (3 - 2 * morphProgress);

        const posAttr = geometry.attributes.position;
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const breathe = 1 + Math.sin(elapsed * CONFIG.BREATHE_SPEED * 1000 + phases[i]) * CONFIG.BREATHE_AMOUNT;

          // Interpolate between sphere and torus
          posAttr.array[i3] = (spherePositions[i3] * (1 - morphEased) + torusPositions[i3] * morphEased) * breathe;
          posAttr.array[i3 + 1] = (spherePositions[i3 + 1] * (1 - morphEased) + torusPositions[i3 + 1] * morphEased) * breathe;
          posAttr.array[i3 + 2] = (spherePositions[i3 + 2] * (1 - morphEased) + torusPositions[i3 + 2] * morphEased) * breathe;
        }
        posAttr.needsUpdate = true;

        // ── Rotation ──
        points.rotation.y = elapsed * CONFIG.ROTATION_SPEED * 1000;
        points.rotation.x = Math.sin(elapsed * 0.2) * 0.1;

        // ── Mouse parallax ──
        points.position.x = 1.5 + mouse.x * CONFIG.MOUSE_INFLUENCE;
        points.position.y = 0.2 + mouse.y * CONFIG.MOUSE_INFLUENCE * 0.5;

        // Dust gentle drift
        dust.rotation.y = elapsed * 0.02;
        dust.rotation.x = elapsed * 0.01;

        // Camera subtle movement
        camera.position.x = mouse.x * 0.15;
        camera.position.y = mouse.y * 0.1;
        camera.lookAt(1.0, 0, 0);

        renderer.render(scene, camera);
      }

      animate();

      // ── Resize ──
      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });
    })();
  </script>

</body>
</html>
