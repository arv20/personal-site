<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aarav K — engineer, builder, and creator." />
  <title>Aarav K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --ink:#030303; --text:#f0f0ed; --muted:#969692; --line:rgba(255,255,255,.14); --accent:#99e9ff; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:var(--text); font-family:"DM Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a, button { color:inherit; font:inherit; }
    a { text-decoration:none; }
    #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
    .grain { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.22; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
    .vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 48%, transparent 36%, rgba(0,0,0,.38) 100%); }
    .ui { position:relative; z-index:2; height:100%; padding:clamp(18px,2.7vw,42px); display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
    .identity, .links { pointer-events:auto; opacity:0; transform:translateY(8px); animation:arrive .8s cubic-bezier(.2,.8,.2,1) .35s forwards; }
    .identity { appearance:none; border:1px solid transparent; background:rgba(5,5,5,.35); border-radius:14px; color:var(--text); padding:10px 14px; text-align:left; cursor:pointer; transition:background .2s,border-color .2s; }
    .identity:hover, .identity[aria-expanded="true"] { border-color:var(--line); background:rgba(15,15,15,.82); }
    .role { display:block; color:var(--muted); font-size:13px; line-height:1.15; }
    .name { display:block; margin-top:3px; font-size:16px; font-weight:500; letter-spacing:-.03em; }
    .plus { position:absolute; right:11px; top:50%; opacity:0; transform:translateY(-50%); color:var(--accent); transition:opacity .2s; } .identity:hover .plus { opacity:1; }
    .links { display:flex; align-items:center; gap:3px; list-style:none; margin:0; padding:0; }
    .links a { display:flex; align-items:center; gap:5px; padding:9px 10px; border-radius:999px; color:rgba(240,240,237,.62); font-size:14px; transition:color .2s,background .2s; }
    .links a:hover, .links a:focus-visible { color:var(--text); background:rgba(255,255,255,.09); outline:none; }
    .arrow { color:var(--accent); font-size:13px; transform:translate(-1px,1px); transition:transform .2s; } .links a:hover .arrow { transform:translate(1px,-1px); }
    .info { position:absolute; left:clamp(18px,2.7vw,42px); bottom:clamp(86px,10vw,120px); width:min(330px,calc(100vw - 36px)); z-index:3; padding:17px 18px 18px; background:rgba(13,13,13,.9); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(12px); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .22s,transform .22s; }
    .info.open { opacity:1; transform:none; pointer-events:auto; } .info p { margin:0; color:#d1d1cd; font-size:14px; line-height:1.5; } .info-label { display:block; margin-bottom:10px; color:var(--muted); font:500 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .info a { display:inline-block; margin-top:14px; color:var(--accent); font-size:13px; }
    .hint { position:fixed; top:clamp(18px,2.7vw,42px); left:50%; z-index:2; color:rgba(240,240,237,.44); font:400 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; transform:translateX(-50%); opacity:0; animation:arrive .8s ease .7s forwards; pointer-events:none; }
    @keyframes arrive { to { opacity:1; transform:translateY(0); } }
    @media (max-width:600px) { .ui { align-items:flex-end; } .links { gap:0; } .links a { padding:8px; font-size:13px; } .links a:last-child { padding-right:0; } .role { font-size:12px; } .name { font-size:15px; } .hint { display:none; } .info { bottom:92px; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } .identity,.links { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain"></div><div class="vignette"></div>
  <span class="hint">move to explore</span>
  <aside class="info" id="info" aria-hidden="true"><span class="info-label">About</span><p>Engineer, builder, and creator. I like turning an interesting problem into a useful, considered piece of software.</p><a href="https://github.com/arv20" target="_blank" rel="noopener">View GitHub <span aria-hidden="true">↗</span></a></aside>
  <main class="ui">
    <button class="identity" id="identity" type="button" aria-expanded="false" aria-controls="info"><span class="role">engineer · builder · creator</span><span class="name">aarav k</span><span class="plus" aria-hidden="true">+</span></button>
    <nav aria-label="Social links"><ul class="links"><li><a href="https://github.com/arv20" target="_blank" rel="noopener">github <span class="arrow" aria-hidden="true">↗</span></a></li><li><a href="https://linkedin.com/in/" target="_blank" rel="noopener">linkedin <span class="arrow" aria-hidden="true">↗</span></a></li><li><a href="mailto:aarav@example.com">email <span class="arrow" aria-hidden="true">↗</span></a></li></ul></nav>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 100); camera.position.z = 6;
    const group = new THREE.Group(); scene.add(group);
    const count = 1350, positions = new Float32Array(count * 3), sizes = new Float32Array(count);
    for (let i=0;i<count;i++) { const t=i/count*Math.PI*18, r=1.5+.65*Math.sin(t*2.5); positions[i*3]=Math.cos(t)*r; positions[i*3+1]=(i/count-.5)*4.5; positions[i*3+2]=Math.sin(t)*r*.46; sizes[i]=Math.random()*1.8+.35; }
    const geometry = new THREE.BufferGeometry(); geometry.setAttribute('position',new THREE.BufferAttribute(positions,3)); geometry.setAttribute('size',new THREE.BufferAttribute(sizes,1));
    const material = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:{ pixel:{value:Math.min(devicePixelRatio,2)}, opacity:{value:.78} }, vertexShader:'attribute float size; uniform float pixel; void main(){ vec4 p=modelViewMatrix*vec4(position,1.); gl_PointSize=size*pixel*(56./-p.z); gl_Position=projectionMatrix*p; }', fragmentShader:'uniform float opacity; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; float a=1.-smoothstep(.05,.5,d); gl_FragColor=vec4(.48,.72,1.,a*a*opacity); }' });
    const points = new THREE.Points(geometry,material); group.add(points);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(2.15,.008,6,120),new THREE.MeshBasicMaterial({color:0x6d95ff,transparent:true,opacity:.34})); halo.rotation.x=1.15; halo.rotation.y=-.38; group.add(halo);
    const mouse={x:0,y:0}, target={x:0,y:0}; addEventListener('pointermove',e=>{ target.x=e.clientX/innerWidth*2-1; target.y=-(e.clientY/innerHeight*2-1); });
    const clock = new THREE.Clock(); function animate(){ requestAnimationFrame(animate); const time=clock.getElapsedTime(); mouse.x+=(target.x-mouse.x)*.035; mouse.y+=(target.y-mouse.y)*.035; group.rotation.y=time*.09+mouse.x*.24; group.rotation.x=Math.sin(time*.22)*.09-mouse.y*.16; group.position.x=mouse.x*.24; group.position.y=mouse.y*.12; halo.rotation.z=time*.06; renderer.render(scene,camera); } animate();
    addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
    const identity=document.querySelector('#identity'), info=document.querySelector('#info'); identity.addEventListener('click',()=>{ const open=info.classList.toggle('open'); identity.setAttribute('aria-expanded',open); info.setAttribute('aria-hidden',!open); });
  </script>
</body>
</html>
