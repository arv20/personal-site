<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aarav K — engineer, builder, and creator." />
  <title>Aarav K — Engineer & Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #0e1713;
      --text: #f4f4f0;
      --muted: #96a39b;
      --line: rgba(255, 255, 255, 0.16);
      --accent: #7ec8a0;
      --accent-glow: rgba(126, 200, 160, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { color: var(--text); font-family: "DM Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a, button { color: inherit; font: inherit; }
    a { text-decoration: none; }
    
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(10, 18, 14, 0.45) 100%);
    }

    .ui {
      position: relative; z-index: 2; height: 100%; padding: clamp(20px, 3vw, 44px);
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
    }
    .identity, .links {
      pointer-events: auto; opacity: 0; transform: translateY(10px);
      animation: arrive 0.9s cubic-bezier(.16, 1, .3, 1) 0.3s forwards;
    }
    .identity {
      appearance: none; border: 1px solid var(--line);
      background: rgba(14, 22, 17, 0.45); border-radius: 16px;
      color: var(--text); padding: 12px 18px; text-align: left; cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .identity:hover, .identity[aria-expanded="true"] {
      border-color: rgba(255, 255, 255, 0.3); background: rgba(20, 32, 24, 0.82);
      transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 16px var(--accent-glow);
    }
    .role { display: block; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.2; letter-spacing: 0.02em; }
    .name { display: block; margin-top: 4px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .plus { position: absolute; right: 14px; top: 50%; opacity: 0; transform: translateY(-50%); color: var(--accent); transition: opacity 0.25s, transform 0.25s; }
    .identity:hover .plus { opacity: 1; transform: translateY(-50%) rotate(90deg); }

    .links { display: flex; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; }
    .links a {
      display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px;
      color: rgba(244, 244, 240, 0.75); font-size: 14px; font-weight: 500;
      background: rgba(14, 22, 17, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
      transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.2s;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .links a:hover, .links a:focus-visible {
      color: var(--text); background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25); transform: translateY(-2px); outline: none;
    }
    .arrow { color: var(--accent); font-size: 13px; transform: translate(-1px, 1px); transition: transform 0.2s; }
    .links a:hover .arrow { transform: translate(2px, -2px); }

    .info {
      position: absolute; left: clamp(20px, 3vw, 44px); bottom: clamp(96px, 11vw, 130px);
      width: min(340px, calc(100vw - 40px)); z-index: 3; padding: 20px 22px;
      background: rgba(14, 22, 17, 0.88); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      opacity: 0; transform: translateY(12px); pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 16px 36px rgba(0,0,0,0.35);
    }
    .info.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .info p { margin: 0; color: #d6ded8; font-size: 14px; line-height: 1.55; }
    .info-label { display: block; margin-bottom: 10px; color: var(--accent); font: 600 11px/1 "DM Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    .info a { display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; color: var(--accent); font-size: 13px; font-weight: 500; }
    
    .hint {
      position: fixed; top: clamp(20px, 3vw, 44px); left: 50%; z-index: 2;
      color: rgba(244, 244, 240, 0.5); font: 500 11px/1 "DM Mono", monospace;
      letter-spacing: 0.12em; text-transform: uppercase; transform: translateX(-50%);
      opacity: 0; animation: arrive 0.9s ease 0.6s forwards; pointer-events: none;
      background: rgba(14, 22, 17, 0.35); padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
    }
    
    @keyframes arrive { to { opacity: 1; transform: translateY(0) translateX(var(--tx, 0)); } }
    .hint { --tx: -50%; }
    
    @media (max-width: 600px) {
      .ui { align-items: flex-end; }
      .links { gap: 4px; }
      .links a { padding: 8px 10px; font-size: 13px; }
      .role { font-size: 12px; }
      .name { font-size: 15px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>
  
  <span class="hint">enjoy the drive</span>
  
  <aside class="info" id="info" aria-hidden="true">
    <span class="info-label">About</span>
    <p>Software engineer, system builder, and creator. Focused on craft, performance, and building thoughtful digital experiences.</p>
    <a href="https://github.com/arv20" target="_blank" rel="noopener">View GitHub Projects <span aria-hidden="true">↗</span></a>
  </aside>

  <main class="ui">
    <button class="identity" id="identity" type="button" aria-expanded="false" aria-controls="info">
      <span class="role">engineer · builder · creator</span>
      <span class="name">aarav k</span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
    <nav aria-label="Social links">
      <ul class="links">
        <li><a href="https://github.com/arv20" target="_blank" rel="noopener">github <span class="arrow" aria-hidden="true">↗</span></a></li>
        <li><a href="https://linkedin.com/in/" target="_blank" rel="noopener">linkedin <span class="arrow" aria-hidden="true">↗</span></a></li>
        <li><a href="mailto:aarav@example.com">email <span class="arrow" aria-hidden="true">↗</span></a></li>
      </ul>
    </nav>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    /* ═══════════════════════════════════════
       RENDERER & PIPELINE
       ═══════════════════════════════════════ */
    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const skyBaseColor = new THREE.Color(0x8cb6a0);
    scene.background = skyBaseColor;
    scene.fog = new THREE.FogExp2(skyBaseColor, 0.0065);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 450);

    /* ═══════════════════════════════════════
       ENVIRONMENT LIGHTING
       ═══════════════════════════════════════ */
    const ambientLight = new THREE.AmbientLight(0xdbe8df, 0.75);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xb5e2e4, 0x4a6b4a, 0.65);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff6e5, 1.9);
    sun.position.set(90, 110, -60);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 350;
    const shadowDim = 60;
    sun.shadow.camera.left = -shadowDim;
    sun.shadow.camera.right = shadowDim;
    sun.shadow.camera.top = shadowDim;
    sun.shadow.camera.bottom = -shadowDim;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    /* ═══════════════════════════════════════
       ROAD SPLINE & MESH
       ═══════════════════════════════════════ */
    const ROAD_LENGTH = 1000;
    const ROAD_SEGMENTS = 1200;
    const ROAD_WIDTH = 6.5;

    // Smooth, organic winding path across landscape
    const roadControlPoints = [];
    for (let i = 0; i <= 25; i++) {
      const z = -i * (ROAD_LENGTH / 25);
      const x = Math.sin(i * 0.38) * 40 + Math.cos(i * 0.14) * 18;
      roadControlPoints.push(new THREE.Vector3(x, 0.1, z));
    }
    const roadCurve = new THREE.CatmullRomCurve3(roadControlPoints, false, 'catmullrom', 0.5);

    // Build Road Ribbon Geometry
    const roadVerts = [];
    const roadUvs = [];
    const roadIndices = [];
    const upVector = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i <= ROAD_SEGMENTS; i++) {
      const t = i / ROAD_SEGMENTS;
      const pos = roadCurve.getPointAt(t);
      const tangent = roadCurve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upVector).normalize();

      const lx = pos.x - right.x * (ROAD_WIDTH / 2);
      const lz = pos.z - right.z * (ROAD_WIDTH / 2);
      const rx = pos.x + right.x * (ROAD_WIDTH / 2);
      const rz = pos.z + right.z * (ROAD_WIDTH / 2);

      roadVerts.push(lx, 0.14, lz);
      roadVerts.push(rx, 0.14, rz);

      roadUvs.push(0, t * 120);
      roadUvs.push(1, t * 120);

      if (i < ROAD_SEGMENTS) {
        const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
        // Winding order: a, b, c, b, d, c -> Normal points UP (+Y)
        roadIndices.push(a, b, c, b, d, c);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUvs, 2));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    // Canvas procedural asphalt texture
    const rCanvas = document.createElement('canvas');
    rCanvas.width = 128; rCanvas.height = 256;
    const ctx = rCanvas.getContext('2d');
    ctx.fillStyle = '#262729';
    ctx.fillRect(0, 0, 128, 256);
    // Shoulder lines
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(2, 0, 3, 256);
    ctx.fillRect(123, 0, 3, 256);
    // Center yellow dashes
    ctx.fillStyle = '#f5c518';
    for (let y = 0; y < 256; y += 32) {
      ctx.fillRect(62, y, 4, 18);
    }
    const roadTex = new THREE.CanvasTexture(rCanvas);
    roadTex.wrapS = THREE.RepeatWrapping;
    roadTex.wrapT = THREE.RepeatWrapping;

    const roadMat = new THREE.MeshStandardMaterial({
      map: roadTex,
      roughness: 0.75,
      metalness: 0.08,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -1
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    /* ═══════════════════════════════════════
       TERRAIN & ROLLING HILLS
       ═══════════════════════════════════════ */
    const groundGeo = new THREE.PlaneGeometry(700, ROAD_LENGTH + 120, 140, 140);
    groundGeo.rotateX(-Math.PI / 2);

    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      const absZ = Math.abs(z);
      // Calculate road position at this Z coordinate to keep corridor clear
      const roadX = Math.sin((absZ / (ROAD_LENGTH / 25)) * 0.38) * 40 + Math.cos((absZ / (ROAD_LENGTH / 25)) * 0.14) * 18;
      const distFromRoad = Math.abs(x - roadX);
      let h = 0;
      if (distFromRoad > 14) {
        const factor = (distFromRoad - 14) * 0.07;
        h = (Math.sin(x * 0.035) * Math.cos(z * 0.025) * 7 + Math.sin(x * 0.07 + z * 0.04) * 3) * Math.min(factor, 2.8);
      }
      gPos.setY(i, h);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x54844e,
      roughness: 0.92,
      metalness: 0.04,
      flatShading: true
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.set(0, 0, -ROAD_LENGTH / 2);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    /* ═══════════════════════════════════════
       VEGETATION & ROADSIDE DETAILS
       ═══════════════════════════════════════ */
    const TREE_COUNT = 600;
    const trunkGeo = new THREE.CylinderGeometry(0.14, 0.22, 1.3, 5);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x483424 });
    const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);

    const pineGeo = new THREE.ConeGeometry(1.0, 2.4, 6);
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x27592e, flatShading: true, roughness: 0.85 });
    const pineInst = new THREE.InstancedMesh(pineGeo, pineMat, TREE_COUNT);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < TREE_COUNT; i++) {
      const z = -Math.random() * (ROAD_LENGTH - 30);
      const side = Math.random() > 0.5 ? 1 : -1;
      const progressT = Math.abs(z) / ROAD_LENGTH;
      const roadPosAtZ = roadCurve.getPointAt(Math.min(Math.max(progressT, 0), 1));
      const offset = 8.5 + Math.random() * 50;
      const x = roadPosAtZ.x + side * offset;
      const scale = 0.75 + Math.random() * 0.9;

      dummy.position.set(x, 0.65 * scale, z);
      dummy.scale.set(scale, scale, scale);
      dummy.updateMatrix();
      trunkInst.setMatrixAt(i, dummy.matrix);

      dummy.position.set(x, 1.95 * scale, z);
      dummy.updateMatrix();
      pineInst.setMatrixAt(i, dummy.matrix);
    }
    trunkInst.castShadow = true;
    pineInst.castShadow = true;
    scene.add(trunkInst, pineInst);

    /* ═══════════════════════════════════════
       3D VEHICLE LOADING & SETUP
       ═══════════════════════════════════════ */
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    // Front Wheels steering pivot reference
    let frontWheels = [];

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function prepareCarModel(model) {
      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          // Store wheel references if named
          if (child.name.toLowerCase().includes('wheel_fl') || child.name.toLowerCase().includes('wheel_fr')) {
            frontWheels.push(child);
          }
        }
      });
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.rotation.y = Math.PI; // Flip 180° so car rear faces camera
      model.position.sub(center); // Center pivot

      const wrapper = new THREE.Group();
      wrapper.add(model);

      const maxDim = Math.max(size.x, size.y, size.z);
      const targetScale = 4.2 / maxDim; // Normalize car length to 4.2 units
      wrapper.scale.setScalar(targetScale);
      wrapper.position.y = (size.y * targetScale) / 2 + 0.06;
      return wrapper;
    }

    gltfLoader.load('ferrari.glb', (gltf) => {
      carGroup.add(prepareCarModel(gltf.scene));
    }, undefined, (err) => {
      console.warn('Ferrari GLB fallback to car.glb:', err);
      const fallbackLoader = new GLTFLoader();
      fallbackLoader.load('car.glb', (gltf) => {
        carGroup.add(prepareCarModel(gltf.scene));
      });
    });

    /* ═══════════════════════════════════════
       EXHAUST DUST PARTICLES
       ═══════════════════════════════════════ */
    const PARTICLE_COUNT = 40;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PARTICLE_COUNT * 3);
    const pAlpha = new Float32Array(PARTICLE_COUNT);
    const pSizes = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      pPos[i * 3] = 0; pPos[i * 3 + 1] = -100; pPos[i * 3 + 2] = 0;
      pAlpha[i] = 0;
      pSizes[i] = Math.random() * 0.4 + 0.2;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('alpha', new THREE.BufferAttribute(pAlpha, 1));

    const pMat = new THREE.PointsMaterial({
      color: 0xc8d8ca,
      size: 0.45,
      transparent: true,
      opacity: 0.3,
      depthWrite: false
    });
    const dustParticles = new THREE.Points(pGeo, pMat);
    scene.add(dustParticles);

    /* ═══════════════════════════════════════
       ANIMATION LOOP & DYNAMIC CAMERA
       ═══════════════════════════════════════ */
    let progress = 0.02;
    const BASE_SPEED = 0.00018;

    const mouse = { x: 0, y: 0 };
    const smoothMouse = { x: 0, y: 0 };
    const cameraPos = new THREE.Vector3();
    let particleIdx = 0;

    addEventListener('pointermove', e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 - 1;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.035;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.035;

      // Advance car along spline
      progress += BASE_SPEED;
      if (progress > 0.96) progress = 0.02;

      // Car position & tangent direction
      const currentPos = roadCurve.getPointAt(progress);
      const aheadPos = roadCurve.getPointAt(Math.min(progress + 0.003, 0.999));
      const lookAheadFar = roadCurve.getPointAt(Math.min(progress + 0.015, 0.999));

      carGroup.position.copy(currentPos);
      carGroup.lookAt(aheadPos.x, aheadPos.y, aheadPos.z);

      // Dynamic Steering calculation based on curve tangent delta
      const currentTang = roadCurve.getTangentAt(progress).normalize();
      const aheadTang = roadCurve.getTangentAt(Math.min(progress + 0.008, 0.999)).normalize();
      const steerDelta = currentTang.x - aheadTang.x;

      frontWheels.forEach(w => {
        w.rotation.y = steerDelta * 2.5;
      });

      // Spawn dust particle behind rear wheels periodically
      if (Math.random() < 0.4) {
        const positions = dustParticles.geometry.attributes.position.array;
        positions[particleIdx * 3] = currentPos.x + (Math.random() - 0.5) * 1.2;
        positions[particleIdx * 3 + 1] = currentPos.y + 0.15;
        positions[particleIdx * 3 + 2] = currentPos.z + 1.8;
        dustParticles.geometry.attributes.position.needsUpdate = true;
        particleIdx = (particleIdx + 1) % PARTICLE_COUNT;
      }

      // Dynamic Chase Camera
      const behindPos = roadCurve.getPointAt(Math.max(progress - 0.014, 0.001));
      const targetCamPos = new THREE.Vector3(
        behindPos.x + smoothMouse.x * 4.5,
        behindPos.y + 2.9 + smoothMouse.y * 1.1,
        behindPos.z + 7.8
      );

      if (cameraPos.lengthSq() === 0) {
        cameraPos.copy(targetCamPos);
      } else {
        cameraPos.lerp(targetCamPos, 0.055);
      }

      camera.position.copy(cameraPos);
      camera.lookAt(lookAheadFar.x, lookAheadFar.y + 0.6, lookAheadFar.z);

      // Keep sun & shadows aligned with car
      sun.position.set(currentPos.x + 90, 110, currentPos.z - 60);
      sun.target = carGroup;

      renderer.render(scene, camera);
    }
    animate();

    /* ═══════════════════
       RESIZE & UI
       ═══════════════════ */
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    const identity = document.querySelector('#identity');
    const info = document.querySelector('#info');
    identity.addEventListener('click', () => {
      const open = info.classList.toggle('open');
      identity.setAttribute('aria-expanded', open);
      info.setAttribute('aria-hidden', !open);
    });
  </script>
</body>
</html>
