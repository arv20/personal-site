<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aarav K — engineer, builder, and creator." />
  <title>Aarav K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --ink:#121a14; --text:#f0f0ed; --muted:#969692; --line:rgba(255,255,255,.14); --accent:#7ec8a0; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:var(--text); font-family:"DM Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a, button { color:inherit; font:inherit; }
    a { text-decoration:none; }
    #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
    .grain { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.10; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
    .vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.35) 100%); }
    .ui { position:relative; z-index:2; height:100%; padding:clamp(18px,2.7vw,42px); display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
    .identity, .links { pointer-events:auto; opacity:0; transform:translateY(8px); animation:arrive .8s cubic-bezier(.2,.8,.2,1) .35s forwards; }
    .identity { appearance:none; border:1px solid transparent; background:rgba(5,5,5,.35); border-radius:14px; color:var(--text); padding:10px 14px; text-align:left; cursor:pointer; transition:background .2s,border-color .2s; backdrop-filter:blur(8px); }
    .identity:hover, .identity[aria-expanded="true"] { border-color:var(--line); background:rgba(15,15,15,.72); }
    .role { display:block; color:var(--muted); font-size:13px; line-height:1.15; }
    .name { display:block; margin-top:3px; font-size:16px; font-weight:500; letter-spacing:-.03em; }
    .plus { position:absolute; right:11px; top:50%; opacity:0; transform:translateY(-50%); color:var(--accent); transition:opacity .2s; } .identity:hover .plus { opacity:1; }
    .links { display:flex; align-items:center; gap:3px; list-style:none; margin:0; padding:0; }
    .links a { display:flex; align-items:center; gap:5px; padding:9px 10px; border-radius:999px; color:rgba(240,240,237,.62); font-size:14px; transition:color .2s,background .2s; backdrop-filter:blur(8px); }
    .links a:hover, .links a:focus-visible { color:var(--text); background:rgba(255,255,255,.09); outline:none; }
    .arrow { color:var(--accent); font-size:13px; transform:translate(-1px,1px); transition:transform .2s; } .links a:hover .arrow { transform:translate(1px,-1px); }
    .info { position:absolute; left:clamp(18px,2.7vw,42px); bottom:clamp(86px,10vw,120px); width:min(330px,calc(100vw - 36px)); z-index:3; padding:17px 18px 18px; background:rgba(13,13,13,.85); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(12px); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .22s,transform .22s; }
    .info.open { opacity:1; transform:none; pointer-events:auto; } .info p { margin:0; color:#d1d1cd; font-size:14px; line-height:1.5; } .info-label { display:block; margin-bottom:10px; color:var(--muted); font:500 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .info a { display:inline-block; margin-top:14px; color:var(--accent); font-size:13px; }
    .hint { position:fixed; top:clamp(18px,2.7vw,42px); left:50%; z-index:2; color:rgba(240,240,237,.44); font:400 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; transform:translateX(-50%); opacity:0; animation:arrive .8s ease .7s forwards; pointer-events:none; }
    @keyframes arrive { to { opacity:1; transform:translateY(0); } }
    @media (max-width:600px) { .ui { align-items:flex-end; } .links { gap:0; } .links a { padding:8px; font-size:13px; } .links a:last-child { padding-right:0; } .role { font-size:12px; } .name { font-size:15px; } .hint { display:none; } .info { bottom:92px; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } .identity,.links { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain"></div><div class="vignette"></div>
  <span class="hint">enjoy the drive</span>
  <aside class="info" id="info" aria-hidden="true"><span class="info-label">About</span><p>Engineer, builder, and creator. I like turning an interesting problem into a useful, considered piece of software.</p><a href="https://github.com/arv20" target="_blank" rel="noopener">View GitHub <span aria-hidden="true">↗</span></a></aside>
  <main class="ui">
    <button class="identity" id="identity" type="button" aria-expanded="false" aria-controls="info"><span class="role">engineer · builder · creator</span><span class="name">aarav k</span><span class="plus" aria-hidden="true">+</span></button>
    <nav aria-label="Social links"><ul class="links"><li><a href="https://github.com/arv20" target="_blank" rel="noopener">github <span class="arrow" aria-hidden="true">↗</span></a></li><li><a href="https://linkedin.com/in/" target="_blank" rel="noopener">linkedin <span class="arrow" aria-hidden="true">↗</span></a></li><li><a href="mailto:aarav@example.com">email <span class="arrow" aria-hidden="true">↗</span></a></li></ul></nav>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    /* ═══════════════════
       RENDERER & SCENE SETUP
       ═══════════════════ */
    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0x90b8a0);
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(skyColor, 0.007);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

    /* ═══════════════════
       LIGHTS
       ═══════════════════ */
    const ambientLight = new THREE.AmbientLight(0xddeedd, 0.7);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xb1e1e4, 0x4c6b48, 0.6);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.8);
    sun.position.set(80, 100, -50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 300;
    const d = 50;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    scene.add(sun);

    /* ═══════════════════════════════════════
       ROAD SPLINE & GEOMETRY
       ═══════════════════════════════════════ */
    const ROAD_LENGTH = 800;
    const ROAD_SEGMENTS = 1000;
    const ROAD_WIDTH = 6;

    // Create a smooth winding path on X-Z plane
    const points = [];
    for (let i = 0; i <= 20; i++) {
      const z = -i * (ROAD_LENGTH / 20);
      const x = Math.sin(i * 0.4) * 35 + Math.cos(i * 0.15) * 15;
      points.push(new THREE.Vector3(x, 0.1, z));
    }
    const roadCurve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);

    // Build Road Ribbon Geometry
    const roadVerts = [];
    const roadUvs = [];
    const roadIndices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i <= ROAD_SEGMENTS; i++) {
      const t = i / ROAD_SEGMENTS;
      const pos = roadCurve.getPointAt(t);
      const tangent = roadCurve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

      const lx = pos.x - right.x * (ROAD_WIDTH / 2);
      const lz = pos.z - right.z * (ROAD_WIDTH / 2);
      const rx = pos.x + right.x * (ROAD_WIDTH / 2);
      const rz = pos.z + right.z * (ROAD_WIDTH / 2);

      roadVerts.push(lx, 0.12, lz);
      roadVerts.push(rx, 0.12, rz);

      roadUvs.push(0, t * 100);
      roadUvs.push(1, t * 100);

      if (i < ROAD_SEGMENTS) {
        const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
        roadIndices.push(a, c, b, b, c, d);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUvs, 2));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    // Road Texture
    const rCanvas = document.createElement('canvas');
    rCanvas.width = 128; rCanvas.height = 256;
    const ctx = rCanvas.getContext('2d');
    ctx.fillStyle = '#2c2d30';
    ctx.fillRect(0, 0, 128, 256);
    // White shoulder lines
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(2, 0, 3, 256);
    ctx.fillRect(123, 0, 3, 256);
    // Yellow dashed center line
    ctx.fillStyle = '#ffcc00';
    for (let y = 0; y < 256; y += 32) {
      ctx.fillRect(62, y, 4, 18);
    }
    const roadTex = new THREE.CanvasTexture(rCanvas);
    roadTex.wrapS = THREE.RepeatWrapping;
    roadTex.wrapT = THREE.RepeatWrapping;

    const roadMat = new THREE.MeshStandardMaterial({
      map: roadTex,
      roughness: 0.7,
      metalness: 0.1,
      polygonOffset: true,
      polygonOffsetFactor: -1
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    /* ═══════════════════════════════════════
       TERRAIN GROUND PLANE & HILLS
       ═══════════════════════════════════════ */
    const groundGeo = new THREE.PlaneGeometry(600, ROAD_LENGTH + 100, 120, 120);
    groundGeo.rotateX(-Math.PI / 2);
    
    // Add gentle rolling hills away from the actual curving road
    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      const absZ = Math.abs(z);
      const roadX = Math.sin((absZ / (ROAD_LENGTH / 20)) * 0.4) * 35 + Math.cos((absZ / (ROAD_LENGTH / 20)) * 0.15) * 15;
      const distFromRoad = Math.abs(x - roadX);
      let h = 0;
      if (distFromRoad > 15) {
        const factor = (distFromRoad - 15) * 0.08;
        h = (Math.sin(x * 0.04) * Math.cos(z * 0.03) * 6 + Math.sin(x * 0.08 + z * 0.05) * 3) * Math.min(factor, 2.5);
      }
      gPos.setY(i, h);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x5a8854,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.set(0, 0, -ROAD_LENGTH / 2);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    /* ═══════════════════════════════════════
       LOW-POLY TREES
       ═══════════════════════════════════════ */
    const TREE_COUNT = 450;
    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, 1.2, 5);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3525 });
    const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);

    const foliageGeo = new THREE.ConeGeometry(0.9, 2.2, 6);
    const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2b5e32, flatShading: true, roughness: 0.8 });
    const foliageInst = new THREE.InstancedMesh(foliageGeo, foliageMat, TREE_COUNT);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < TREE_COUNT; i++) {
      const z = -Math.random() * (ROAD_LENGTH - 20);
      const side = Math.random() > 0.5 ? 1 : -1;
      const roadX = Math.sin((Math.abs(z) / (ROAD_LENGTH / 20)) * 0.4) * 35 + Math.cos((Math.abs(z) / (ROAD_LENGTH / 20)) * 0.15) * 15;
      const offset = 8 + Math.random() * 45;
      const x = roadX + side * offset;
      const scale = 0.8 + Math.random() * 0.8;

      dummy.position.set(x, 0.6 * scale, z);
      dummy.scale.set(scale, scale, scale);
      dummy.updateMatrix();
      trunkInst.setMatrixAt(i, dummy.matrix);

      dummy.position.set(x, 1.8 * scale, z);
      dummy.updateMatrix();
      foliageInst.setMatrixAt(i, dummy.matrix);
    }
    trunkInst.castShadow = true;
    foliageInst.castShadow = true;
    scene.add(trunkInst, foliageInst);

    /* ═══════════════════════════════════════
       3D CAR MODEL LOADING
       ═══════════════════════════════════════ */
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    // Setup DRACO + GLTF Loaders
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function fitModel(model) {
      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      model.rotation.y = Math.PI; // Flip 180 degrees so car front faces forward along road
      model.position.sub(center); // Center pivot
      const wrapper = new THREE.Group();
      wrapper.add(model);

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 4.2 / maxDim; // Normalize length to 4.2 units
      wrapper.scale.setScalar(scale);
      wrapper.position.y = (size.y * scale) / 2 + 0.05;
      return wrapper;
    }

    gltfLoader.load('ferrari.glb', (gltf) => {
      carGroup.add(fitModel(gltf.scene));
    }, undefined, (err) => {
      console.warn('Ferrari GLB failed, trying fallback car.glb:', err);
      const fallbackLoader = new GLTFLoader();
      fallbackLoader.load('car.glb', (gltf) => {
        carGroup.add(fitModel(gltf.scene));
      });
    });

    /* ═══════════════════════════════════════
       ANIMATION LOOP & CHASE CAMERA
       ═══════════════════════════════════════ */
    let progress = 0.005;
    const SPEED = 0.00018;

    const mouse = { x: 0, y: 0 };
    const smoothMouse = { x: 0, y: 0 };
    const cameraPos = new THREE.Vector3();

    addEventListener('pointermove', e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 - 1;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.03;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.03;

      // Progress along road
      progress += SPEED;
      if (progress > 0.95) progress = 0.005;

      // Car position & orientation
      const currentPos = roadCurve.getPointAt(progress);
      const aheadPos = roadCurve.getPointAt(Math.min(progress + 0.003, 0.999));

      carGroup.position.copy(currentPos);
      carGroup.lookAt(aheadPos.x, aheadPos.y, aheadPos.z);

      // Chase Camera setup (following smoothly behind car)
      const behindPos = roadCurve.getPointAt(Math.max(progress - 0.012, 0.001));
      const targetCamPos = new THREE.Vector3(
        behindPos.x + smoothMouse.x * 4,
        behindPos.y + 2.8 + smoothMouse.y * 1.0,
        behindPos.z + 7.5
      );

      if (cameraPos.lengthSq() === 0) {
        cameraPos.copy(targetCamPos);
      } else {
        cameraPos.lerp(targetCamPos, 0.06);
      }

      camera.position.copy(cameraPos);
      camera.lookAt(aheadPos.x, aheadPos.y + 0.8, aheadPos.z);

      // Keep sun shadows aligned with car movement
      sun.position.set(currentPos.x + 80, 100, currentPos.z - 50);
      sun.target = carGroup;

      renderer.render(scene, camera);
    }
    animate();

    /* ═══════════════════
       RESIZE
       ═══════════════════ */
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    /* ═══════════════════
       UI INTERACTION
       ═══════════════════ */
    const identity = document.querySelector('#identity');
    const info = document.querySelector('#info');
    identity.addEventListener('click', () => {
      const open = info.classList.toggle('open');
      identity.setAttribute('aria-expanded', open);
      info.setAttribute('aria-hidden', !open);
    });
  </script>
</body>
</html>
