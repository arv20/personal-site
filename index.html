  <style>
    :root {
      color-scheme: dark;
      --ink: #0e1713;
      --text: #f4f4f0;
      --muted: #96a39b;
      --line: rgba(255, 255, 255, 0.16);

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { color: var(--text); font-family: "DM Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a, button { color: inherit; font: inherit; }

    #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(10, 18, 14, 0.45) 100%);

    .ui {
      position: relative; z-index: 2; height: 100%; padding: clamp(20px, 3vw, 44px);
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
    }
    .identity, .links, .hud-stats {
      pointer-events: auto; opacity: 0; transform: translateY(10px);
      animation: arrive 0.9s cubic-bezier(.16, 1, .3, 1) 0.3s forwards;
    }
    .identity {
      appearance: none; border: 1px solid var(--line);
      background: rgba(14, 22, 17, 0.45); border-radius: 16px;
      color: var(--text); padding: 12px 18px; text-align: left; cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .identity:hover, .identity[aria-expanded="true"] {
      border-color: rgba(255, 255, 255, 0.3); background: rgba(20, 32, 24, 0.82);
      transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 16px var(--accent-glow);

    .role { display: block; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.2; letter-spacing: 0.02em; }

    .plus { position: absolute; right: 14px; top: 50%; opacity: 0; transform: translateY(-50%); color: var(--accent); transition: opacity 0.25s, transform 0.25s; }

    .links { display: flex; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; }

    .info {

      box-shadow: 0 16px 36px rgba(0,0,0,0.35);
    }
    .info.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .info p { margin: 0; color: #d6ded8; font-size: 14px; line-height: 1.55; }
    .info-label { display: block; margin-bottom: 10px; color: var(--accent); font: 600 11px/1 "DM Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    .info a { display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; color: var(--accent); font-size: 13px; font-weight: 500; }
    
    .hint {

      letter-spacing: 0.1em; text-transform: uppercase; transform: translateX(-50%);
      opacity: 0; animation: arrive 0.9s ease 0.6s forwards; pointer-events: none;
      background: rgba(14, 22, 17, 0.45); padding: 6px 14px; border-radius: 999px;

      display: flex; align-items: center; gap: 6px;
    }
    kbd {
      display: inline-block; padding: 2px 5px; font-family: inherit; font-size: 10px;

    }
    kbd.active {
      background: var(--accent); color: #0e1713; border-color: var(--accent);
      transform: scale(1.15); box-shadow: 0 0 10px var(--accent-glow);

    @keyframes arrive { to { opacity: 1; transform: translateY(0) translateX(var(--tx, 0)); } }
    .hint { --tx: -50%; }
    
    @media (max-width: 600px) {
      .ui { padding: 14px; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 8px; }
      .links { gap: 6px; flex-wrap: wrap; justify-content: flex-start; }
      .links a { padding: 6px 10px; font-size: 12px; }
      .role { font-size: 11px; }

      .hint { display: none; }
      .touch-controls { display: flex; position: fixed; bottom: 115px; right: 14px; gap: 6px; z-index: 3; }
      .touch-btn { padding: 8px 12px; font-size: 11px; }
      .hud-stats { top: 14px; right: 14px; font-size: 10px; padding: 6px 12px; gap: 8px; }
      .info { bottom: 120px; left: 14px; width: calc(100vw - 28px); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    /* ═══════════════════════════════════════
       RENDERER & PIPELINE
       ═══════════════════════════════════════ */
    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    
    const skyMorning = new THREE.Color(0x8cb6a0);
    const skySunset = new THREE.Color(0xba8c72);
    const skyTwilight = new THREE.Color(0x354452);
    const currentSkyColor = skyMorning.clone();
    
    scene.background = currentSkyColor;
    scene.fog = new THREE.FogExp2(currentSkyColor, 0.0065);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 450);

    /* ═══════════════════════════════════════
       ENVIRONMENT LIGHTING
       ═══════════════════════════════════════ */
    const ambientLight = new THREE.AmbientLight(0xdbe8df, 0.75);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xb5e2e4, 0x4a6b4a, 0.65);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff6e5, 1.9);
    sun.position.set(90, 110, -60);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 350;
    const shadowDim = 60;
    sun.shadow.camera.left = -shadowDim;
    sun.shadow.camera.right = shadowDim;
    sun.shadow.camera.top = shadowDim;
    sun.shadow.camera.bottom = -shadowDim;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    /* ═══════════════════════════════════════
       SEAMLESS ROAD SPLINE & TIRE SKID MARKS
       ═══════════════════════════════════════ */
    const ROAD_LENGTH = 1000;
    const ROAD_SEGMENTS = 1400;
    const ROAD_WIDTH = 6.5;

    const roadControlPoints = [];
    const NUM_PTS = 26;
    for (let i = 0; i <= NUM_PTS; i++) {
      const tNorm = i / NUM_PTS;
      const z = -tNorm * ROAD_LENGTH;
      // Cosine envelope ensures start (i=0) and end (i=NUM_PTS) seamlessly taper to x=0 with matching 0 slope!
      const envelope = Math.sin(tNorm * Math.PI); 
      const x = (Math.sin(tNorm * Math.PI * 4) * 36 + Math.cos(tNorm * Math.PI * 2) * 16) * envelope;
      roadControlPoints.push(new THREE.Vector3(x, 0.1, z));
    }
    const roadCurve = new THREE.CatmullRomCurve3(roadControlPoints, false, 'catmullrom', 0.5);

    const roadVerts = [];
    const roadUvs = [];
    const roadIndices = [];
    const upVector = new THREE.Vector3(0, 1, 0);

    const skidVerts = [];
    const skidIndices = [];

    for (let i = 0; i <= ROAD_SEGMENTS; i++) {
      const t = i / ROAD_SEGMENTS;
      const pos = roadCurve.getPointAt(t);
      const tangent = roadCurve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upVector).normalize();

      const lx = pos.x - right.x * (ROAD_WIDTH / 2);
      const lz = pos.z - right.z * (ROAD_WIDTH / 2);
      const rx = pos.x + right.x * (ROAD_WIDTH / 2);
      const rz = pos.z + right.z * (ROAD_WIDTH / 2);

      roadVerts.push(lx, 0.14, lz);
      roadVerts.push(rx, 0.14, rz);

      roadUvs.push(0, t * 140);
      roadUvs.push(1, t * 140);

      if (i < ROAD_SEGMENTS) {
        const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
        roadIndices.push(a, b, c, b, d, c);

        const tAhead = (i + 1) / ROAD_SEGMENTS;
        const tangAhead = roadCurve.getTangentAt(tAhead).normalize();
        const curveAngle = Math.abs(tangent.x - tangAhead.x);

        if (curveAngle > 0.0028) {
          const sIdx = skidVerts.length / 3;
          const slx = pos.x - right.x * 1.55;
          const slz = pos.z - right.z * 1.55;
          const srx = pos.x + right.x * 1.55;
          const srz = pos.z + right.z * 1.55;

          const nPos = roadCurve.getPointAt(tAhead);
          const nTang = roadCurve.getTangentAt(tAhead).normalize();
          const nRight = new THREE.Vector3().crossVectors(nTang, upVector).normalize();
          const nslx = nPos.x - nRight.x * 1.55;
          const nslz = nPos.z - nRight.z * 1.55;
          const nsrx = nPos.x + nRight.x * 1.55;
          const nsrz = nPos.z + nRight.z * 1.55;

          skidVerts.push(slx, 0.146, slz, srx, 0.146, srz, nslx, 0.146, nslz, nsrx, 0.146, nsrz);
          skidIndices.push(sIdx, sIdx + 1, sIdx + 2, sIdx + 1, sIdx + 3, sIdx + 2);
        }
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUvs, 2));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const rCanvas = document.createElement('canvas');
    rCanvas.width = 128; rCanvas.height = 256;
    const ctx = rCanvas.getContext('2d');
    ctx.fillStyle = '#262729';
    ctx.fillRect(0, 0, 128, 256);
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(2, 0, 3, 256);
    ctx.fillRect(123, 0, 3, 256);
    ctx.fillStyle = '#f5c518';
    for (let y = 0; y < 256; y += 32) {
      ctx.fillRect(62, y, 4, 18);
    }
    const roadTex = new THREE.CanvasTexture(rCanvas);
    roadTex.wrapS = THREE.RepeatWrapping;
    roadTex.wrapT = THREE.RepeatWrapping;

    const roadMat = new THREE.MeshStandardMaterial({
      map: roadTex,
      roughness: 0.75,
      metalness: 0.08,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -1
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    if (skidVerts.length > 0) {
      const skidGeo = new THREE.BufferGeometry();
      skidGeo.setAttribute('position', new THREE.Float32BufferAttribute(skidVerts, 3));
      skidGeo.setIndex(skidIndices);
      const skidMat = new THREE.MeshBasicMaterial({
        color: 0x111315,
        transparent: true,
        opacity: 0.38,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: -2
      });
      const skidMesh = new THREE.Mesh(skidGeo, skidMat);
      scene.add(skidMesh);
    }

    /* ═══════════════════════════════════════
       EXACT SPLINE DISTANCE TERRAIN FLATTENING
       ═══════════════════════════════════════ */
    const groundGeo = new THREE.PlaneGeometry(700, ROAD_LENGTH + 120, 140, 140);
    groundGeo.rotateX(-Math.PI / 2);

    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      const worldZ = z - ROAD_LENGTH / 2;
      const tNorm = Math.max(0, Math.min(1, Math.abs(worldZ) / ROAD_LENGTH));
      const roadPt = roadCurve.getPointAt(tNorm);

      const dist = Math.hypot(x - roadPt.x, worldZ - roadPt.z);
      let h = 0;
      if (dist > 7.5) {
        const hillFactor = Math.min((dist - 7.5) * 0.07, 1.0);
        h = (Math.sin(x * 0.035) * Math.cos(worldZ * 0.025) * 7.5 + Math.sin(x * 0.07 + worldZ * 0.04) * 3.2) * hillFactor;
      }
      gPos.setY(i, h);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x54844e,
      roughness: 0.92,
      metalness: 0.04,
      flatShading: true
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.set(0, 0, -ROAD_LENGTH / 2);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    /* ═══════════════════════════════════════
       PERPENDICULAR PROPS PLACEMENT (TREES, ROCKS, POSTS)
       ═══════════════════════════════════════ */
    const dummy = new THREE.Object3D();

    const TREE_COUNT = 600;
    const trunkGeo = new THREE.CylinderGeometry(0.14, 0.22, 1.3, 5);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x483424 });
    const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);

    const pineGeo = new THREE.ConeGeometry(1.0, 2.4, 6);
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x27592e, flatShading: true, roughness: 0.85 });
    const pineInst = new THREE.InstancedMesh(pineGeo, pineMat, TREE_COUNT);

    for (let i = 0; i < TREE_COUNT; i++) {
      const tNorm = Math.random() * 0.96 + 0.02;
      const roadPos = roadCurve.getPointAt(tNorm);
      const tangent = roadCurve.getTangentAt(tNorm).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upVector).normalize();

      const side = Math.random() > 0.5 ? 1 : -1;
      const offset = (ROAD_WIDTH / 2 + 3.5) + Math.random() * 45;
      const px = roadPos.x + right.x * side * offset;
      const pz = roadPos.z + right.z * side * offset;
      const scale = 0.75 + Math.random() * 0.9;

      dummy.position.set(px, 0.65 * scale, pz);
      dummy.scale.set(scale, scale, scale);
      dummy.updateMatrix();
      trunkInst.setMatrixAt(i, dummy.matrix);

      dummy.position.set(px, 1.95 * scale, pz);
      dummy.updateMatrix();
      pineInst.setMatrixAt(i, dummy.matrix);
    }
    trunkInst.castShadow = true; pineInst.castShadow = true;
    trunkInst.computeBoundingSphere(); pineInst.computeBoundingSphere();
    scene.add(trunkInst, pineInst);

    const ROCK_COUNT = 150;
    const rockGeo = new THREE.DodecahedronGeometry(0.7, 0);
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6e7872, flatShading: true, roughness: 0.9 });
    const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, ROCK_COUNT);

    for (let i = 0; i < ROCK_COUNT; i++) {
      const tNorm = Math.random() * 0.96 + 0.02;
      const roadPos = roadCurve.getPointAt(tNorm);
      const tangent = roadCurve.getTangentAt(tNorm).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upVector).normalize();

      const side = Math.random() > 0.5 ? 1 : -1;
      const offset = (ROAD_WIDTH / 2 + 2.2) + Math.random() * 20;
      const px = roadPos.x + right.x * side * offset;
      const pz = roadPos.z + right.z * side * offset;
      const scale = 0.5 + Math.random() * 0.8;

      dummy.position.set(px, 0.3 * scale, pz);
      dummy.scale.set(scale, scale * (0.6 + Math.random() * 0.5), scale);
      dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      dummy.updateMatrix();
      rockInst.setMatrixAt(i, dummy.matrix);
    }
    rockInst.castShadow = true;
    rockInst.computeBoundingSphere();
    scene.add(rockInst);

    const POST_COUNT = 35;
    const postBaseGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.9, 6);
    const postBaseMat = new THREE.MeshLambertMaterial({ color: 0x3d2b1f });
    const postBaseInst = new THREE.InstancedMesh(postBaseGeo, postBaseMat, POST_COUNT);

    const postCapGeo = new THREE.BoxGeometry(0.2, 0.18, 0.1);
    const postCapMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const postCapInst = new THREE.InstancedMesh(postCapGeo, postCapMat, POST_COUNT);

    for (let i = 0; i < POST_COUNT; i++) {
      const t = (i / POST_COUNT) * 0.95 + 0.02;
      const pos = roadCurve.getPointAt(t);
      const tangent = roadCurve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upVector).normalize();
      
      const side = (i % 2 === 0) ? 1 : -1;
      const px = pos.x + right.x * side * (ROAD_WIDTH / 2 + 0.8);
      const pz = pos.z + right.z * side * (ROAD_WIDTH / 2 + 0.8);

      dummy.position.set(px, 0.45, pz);
      dummy.scale.set(1, 1, 1);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      postBaseInst.setMatrixAt(i, dummy.matrix);

      dummy.position.set(px, 0.85, pz);
      dummy.updateMatrix();
      postCapInst.setMatrixAt(i, dummy.matrix);
    }
    postBaseInst.computeBoundingSphere(); postCapInst.computeBoundingSphere();
    scene.add(postBaseInst, postCapInst);

    /* ═══════════════════════════════════════
       FLOCK OF BIRDS
       ═══════════════════════════════════════ */
    const BIRD_COUNT = 14;
    const birdGroup = new THREE.Group();
    const birdWings = [];

    const wingShapeGeo = new THREE.BufferGeometry();
    const wingVerts = new Float32Array([
      -0.4, 0, 0,  0, 0.08, -0.15,  0, 0, 0,
       0, 0, 0,    0, 0.08, -0.15,  0.4, 0, 0
    ]);
    wingShapeGeo.setAttribute('position', new THREE.BufferAttribute(wingVerts, 3));
    wingShapeGeo.computeVertexNormals();

    const birdMat = new THREE.MeshBasicMaterial({ color: 0x223328, side: THREE.DoubleSide });

    for (let i = 0; i < BIRD_COUNT; i++) {
      const bMesh = new THREE.Mesh(wingShapeGeo, birdMat);
      bMesh.position.set(
        (Math.random() - 0.5) * 60,
        18 + Math.random() * 8,
        -150 - Math.random() * 200
      );
      bMesh.scale.setScalar(1.2 + Math.random() * 0.6);
      birdGroup.add(bMesh);
      birdWings.push(bMesh);
    }
    scene.add(birdGroup);

    /* ═══════════════════════════════════════
       3D VEHICLE LOADING & LIGHTS
       ═══════════════════════════════════════ */
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    const tailGlowGeo = new THREE.PlaneGeometry(0.8, 0.18);
    const tailGlowMat = new THREE.MeshBasicMaterial({
      color: 0xff1100,
      transparent: true,
      opacity: 0.5,
      side: THREE.DoubleSide
    });
    const tailGlowMesh = new THREE.Mesh(tailGlowGeo, tailGlowMat);
    tailGlowMesh.position.set(0, 0.48, -2.12);

    const headlightLeft = new THREE.SpotLight(0xfff5dd, 0, 45, Math.PI / 6, 0.4, 1);
    headlightLeft.position.set(-0.6, 0.55, 2.0);
    const headlightRight = new THREE.SpotLight(0xfff5dd, 0, 45, Math.PI / 6, 0.4, 1);
    headlightRight.position.set(0.6, 0.55, 2.0);

    const targetLeft = new THREE.Object3D();
    targetLeft.position.set(-0.6, 0.1, 15);
    carGroup.add(targetLeft);
    headlightLeft.target = targetLeft;

    const targetRight = new THREE.Object3D();
    targetRight.position.set(0.6, 0.1, 15);
    carGroup.add(targetRight);
    headlightRight.target = targetRight;

    carGroup.add(headlightLeft, headlightRight);

    let frontWheels = [];
    let innerCarMesh = null;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function prepareCarModel(model) {
      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.name.toLowerCase().includes('wheel_fl') || child.name.toLowerCase().includes('wheel_fr')) {
            frontWheels.push(child);
          }
        }
      });
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.rotation.y = Math.PI;
      model.position.sub(center);

      const wrapper = new THREE.Group();
      wrapper.add(model);
      wrapper.add(tailGlowMesh);
      innerCarMesh = wrapper;

      const maxDim = Math.max(size.x, size.y, size.z);
      const targetScale = 4.2 / maxDim;
      wrapper.scale.setScalar(targetScale);
      wrapper.position.y = (size.y * targetScale) / 2 + 0.06;
      return wrapper;
    }

    gltfLoader.load('ferrari.glb', (gltf) => {
      carGroup.add(prepareCarModel(gltf.scene));
    }, undefined, (err) => {
      console.warn('Ferrari GLB fallback to car.glb:', err);
      const fallbackLoader = new GLTFLoader();
      fallbackLoader.load('car.glb', (gltf) => {
        carGroup.add(prepareCarModel(gltf.scene));
      });
    });

    /* ═══════════════════════════════════════
       EXHAUST DUST PARTICLES
       ═══════════════════════════════════════ */
    const PARTICLE_COUNT = 45;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      pPos[i * 3] = 0; pPos[i * 3 + 1] = -100; pPos[i * 3 + 2] = 0;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

    const pMat = new THREE.PointsMaterial({
      color: 0xc8d8ca,
      size: 0.5,
      transparent: true,
      opacity: 0.35,
      depthWrite: false
    });
    const dustParticles = new THREE.Points(pGeo, pMat);
    scene.add(dustParticles);

    /* ═══════════════════════════════════════
       INTERACTIVE DRIVE CONTROLS & TOUCH
       ═══════════════════════════════════════ */
    let speedMultiplier = 1.0;
    let targetSpeedMultiplier = 1.0;

    const kUp = document.querySelector('#kUp');
    const kDown = document.querySelector('#kDown');
    const btnGas = document.querySelector('#btnGas');
    const btnBrake = document.querySelector('#btnBrake');

    function setGas(active) {
      targetSpeedMultiplier = active ? 1.8 : 1.0;
      kUp?.classList.toggle('active', active);
      tailGlowMat.opacity = 0.5;
    }
    function setBrake(active) {
      targetSpeedMultiplier = active ? 0.45 : 1.0;
      kDown?.classList.toggle('active', active);
      tailGlowMat.opacity = active ? 1.0 : 0.5;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setGas(true);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setBrake(true);
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'w', 'W'].includes(e.key)) setGas(false);
      if (['ArrowDown', 's', 'S'].includes(e.key)) setBrake(false);
    });

    btnGas?.addEventListener('touchstart', (e) => { e.preventDefault(); setGas(true); }, { passive: false });
    btnGas?.addEventListener('touchend', (e) => { e.preventDefault(); setGas(false); }, { passive: false });
    btnBrake?.addEventListener('touchstart', (e) => { e.preventDefault(); setBrake(true); }, { passive: false });
    btnBrake?.addEventListener('touchend', (e) => { e.preventDefault(); setBrake(false); }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.ui') || e.target.closest('.info') || e.target.closest('.touch-controls') || e.target.closest('.hud-stats')) return;
      const touchY = e.touches[0].clientY;
      if (touchY < innerHeight * 0.5) setGas(true); else setBrake(true);
    }, { passive: true });

    window.addEventListener('touchend', () => {
      setGas(false); setBrake(false);
    }, { passive: true });

    /* ═══════════════════════════════════════
       DUAL-OSCILLATOR WEB AUDIO ENGINE HUM SYNTHESIZER
       ═══════════════════════════════════════ */
    class EngineAudioSynthesizer {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.filter = null;
        this.gain = null;
        this.active = false;
      }
      init() {
        if (this.ctx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContextClass();
        
        this.osc1 = this.ctx.createOscillator();
        this.osc2 = this.ctx.createOscillator();
        this.filter = this.ctx.createBiquadFilter();
        this.gain = this.ctx.createGain();

        this.osc1.type = 'sawtooth';
        this.osc2.type = 'triangle';

        this.filter.type = 'lowpass';
        this.filter.Q.value = 2.5;

        this.gain.gain.value = 0.0001;

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
      }
      toggle() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.active = !this.active;
        const targetGain = this.active ? 0.08 : 0.0001;
        this.gain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.1);
        return this.active;
      }
      update(spd) {
        if (!this.active || !this.ctx) return;
        const now = this.ctx.currentTime;
        const baseFreq = 46 * Math.pow(spd, 1.15);
        this.osc1.frequency.setTargetAtTime(baseFreq, now, 0.05);
        this.osc2.frequency.setTargetAtTime(baseFreq * 1.015, now, 0.05);

        const cutoff = 180 + spd * 380;
        this.filter.frequency.setTargetAtTime(cutoff, now, 0.05);
      }
    }

    const engineAudio = new EngineAudioSynthesizer();
    const btnAudio = document.querySelector('#btnAudio');

    btnAudio?.addEventListener('click', () => {
      const isLive = engineAudio.toggle();
      btnAudio.textContent = isLive ? 'SOUND 🔊' : 'SOUND 🔇';
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && engineAudio.active && engineAudio.ctx) {
        engineAudio.gain.gain.setTargetAtTime(0.0001, engineAudio.ctx.currentTime, 0.1);
      }
    });

    /* ═══════════════════════════════════════
       ZERO-GC REUSABLE VECTOR TARGETS & ANIMATION LOOP
       ═══════════════════════════════════════ */
    const _pos = new THREE.Vector3();
    const _aheadPos = new THREE.Vector3();
    const _lookAheadFar = new THREE.Vector3();
    const _behindPos = new THREE.Vector3();
    const _currentTang = new THREE.Vector3();
    const _aheadTang = new THREE.Vector3();
    const _targetCamPos = new THREE.Vector3();

    let progress = 0.02;
    const BASE_SPEED = 0.00018;
    let frameCount = 0;

    const mouse = { x: 0, y: 0 };
    const smoothMouse = { x: 0, y: 0 };
    const cameraPos = new THREE.Vector3();
    let particleIdx = 0;

    const speedValEl = document.querySelector('#speedVal');
    const distValEl = document.querySelector('#distVal');

    addEventListener('pointermove', e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 - 1;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;
      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      if (frameCount % 2 === 0) {
        renderer.shadowMap.needsUpdate = true;
      }

      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.035;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.035;

      speedMultiplier += (targetSpeedMultiplier - speedMultiplier) * 0.05;

      progress += BASE_SPEED * speedMultiplier;
      if (progress > 0.96) progress = 0.02;

      engineAudio.update(speedMultiplier);

      birdWings.forEach((bird, idx) => {
        bird.rotation.z = Math.sin(time * 9 + idx) * 0.25;
        bird.position.x += Math.sin(time * 0.2 + idx) * 0.04;
      });

      const currentSpeed = Math.round(64 * speedMultiplier + Math.sin(progress * 40) * 4);
      if (speedValEl) speedValEl.textContent = `${currentSpeed} MPH`;
      if (distValEl) distValEl.textContent = `${(progress * 8.5).toFixed(1)} KM`;

      if (progress < 0.38) {
        const norm = progress / 0.38;
        currentSkyColor.copy(skyMorning).lerp(skySunset, norm);
        sun.intensity = 1.9 - norm * 0.5;
        headlightLeft.intensity = norm * 4.0;
        headlightRight.intensity = norm * 4.0;
      } else {
        const norm = (progress - 0.38) / 0.58;
        currentSkyColor.copy(skySunset).lerp(skyTwilight, norm);
        sun.intensity = 1.4 - norm * 0.9;
        headlightLeft.intensity = 4.0 + norm * 8.0;
        headlightRight.intensity = 4.0 + norm * 8.0;
      }
      scene.background = currentSkyColor;
      scene.fog.color = currentSkyColor;

      roadCurve.getPointAt(progress, _pos);
      roadCurve.getPointAt(Math.min(progress + 0.003, 0.999), _aheadPos);
      roadCurve.getPointAt(Math.min(progress + 0.015, 0.999), _lookAheadFar);

      carGroup.position.copy(_pos);
      carGroup.lookAt(_aheadPos.x, _aheadPos.y, _aheadPos.z);

      roadCurve.getTangentAt(progress, _currentTang).normalize();
      roadCurve.getTangentAt(Math.min(progress + 0.008, 0.999), _aheadTang).normalize();
      const steerDelta = _currentTang.x - _aheadTang.x;

      frontWheels.forEach(w => {
        w.rotation.y = steerDelta * 2.6;
      });

      if (innerCarMesh) {
        innerCarMesh.rotation.z = -steerDelta * 0.8;
      }

      if (carGroup.children.length > 0 && Math.random() < 0.45) {
        const positions = dustParticles.geometry.attributes.position.array;
        positions[particleIdx * 3] = _pos.x + (Math.random() - 0.5) * 1.2;
        positions[particleIdx * 3 + 1] = _pos.y + 0.15;
        positions[particleIdx * 3 + 2] = _pos.z + 1.8;
        dustParticles.geometry.attributes.position.needsUpdate = true;
        particleIdx = (particleIdx + 1) % PARTICLE_COUNT;
      }

      const targetFov = 52 + (speedMultiplier - 1.0) * 7.5;
      if (Math.abs(camera.fov - targetFov) > 0.05) {
        camera.fov += (targetFov - camera.fov) * 0.08;
        camera.updateProjectionMatrix();
      }

      roadCurve.getPointAt(Math.max(progress - 0.014, 0.001), _behindPos);
      _targetCamPos.set(
        _behindPos.x + smoothMouse.x * 3.5,
        _behindPos.y + 2.8 + smoothMouse.y * 0.8,
        _behindPos.z
      );

      // Terrain Floor Clamp: Guarantee camera never dips below local terrain or road elevation
      const cWorldZ = _targetCamPos.z;
      const cNormT = Math.max(0, Math.min(1, Math.abs(cWorldZ) / ROAD_LENGTH));
      const cRoadPt = roadCurve.getPointAt(cNormT);
      const cDist = Math.hypot(_targetCamPos.x - cRoadPt.x, cWorldZ - cRoadPt.z);
      let cHillH = 0;
      if (cDist > 7.5) {
        const cFactor = Math.min((cDist - 7.5) * 0.07, 1.0);
        cHillH = (Math.sin(_targetCamPos.x * 0.035) * Math.cos(cWorldZ * 0.025) * 7.5 + Math.sin(_targetCamPos.x * 0.07 + cWorldZ * 0.04) * 3.2) * cFactor;
      }
      _targetCamPos.y = Math.max(_targetCamPos.y, cHillH + 1.8, 1.8);

      if (cameraPos.lengthSq() === 0) {
        cameraPos.copy(_targetCamPos);
      } else {
        cameraPos.lerp(_targetCamPos, 0.055);
      }

      camera.position.copy(cameraPos);
      camera.lookAt(_lookAheadFar.x, _lookAheadFar.y + 0.6, _lookAheadFar.z);

      sun.position.set(_pos.x + 90, 110, _pos.z - 60);
      sun.target = carGroup;

      renderer.render(scene, camera);
    }
    animate();

    /* ═══════════════════
       RESIZE & UI
       ═══════════════════ */
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    const identity = document.querySelector('#identity');
    const info = document.querySelector('#info');
    identity.addEventListener('click', () => {
      const open = info.classList.toggle('open');
      identity.setAttribute('aria-expanded', open);
      info.setAttribute('aria-hidden', !open);
    });
  </script>
</body>
</html>
